name: "CD Pipeline"

on:
    workflow_run:
        workflows: ["Setup Basic CI Pipeline"] # Must EXACTLY match the 'name:' of your CI workflow
        types:
            - completed
        branches:
            - main

jobs:
    deploy:
        # Conditions: CI must pass AND event must be an actual push/merge to main (not a PR)
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'

        runs-on: ubuntu-latest

        environment: Production

        steps: 
            - name: "Setup nodejs"
              uses: actions/setup-node@v7
              with:
                node-version: 24

            - name: "Setup Vercel CLI"
              run: npm i -g vercel

            - name: "Download build files"
              uses: actions/download-artifact@v4
              with:
                name: build
                run-id: ${{github.event.workflow_run.id}}
                github-token: ${{github.token}}

            - name: "Deploy to Vercel"
              run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --confirm --name=cicdproject


